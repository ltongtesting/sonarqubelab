name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "GitHub Actions runner is working!"
          echo "Hostname:"
          hostname
          echo "User:"
          whoami
          echo "Working directory:"
          pwd

      - name: List repository files
        run: |
          ls -la
